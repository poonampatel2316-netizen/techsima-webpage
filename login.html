<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Website & APP Development Company in Lucknow</title>
  <link rel="shortcut icon" href="images/favicon.png" type="images/x-icon">
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/owl.theme.green.min.css">
  <link rel="stylesheet" href="css/owl.carousel.min.css">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-xl-12">
      <div class="ad-login">
        
        <div class="ad-login-card">
          <h4 class="ad-login-title">Welcome Back</h4>
          <p class="ad-login-subtitle">Login to your admin account</p>

          <form>
            <div class="mb-3">
              <label class="ad-form-label">Email Address</label>
              <input type="email" class="ad-form-control" placeholder="Enter Your Email">
            </div>

            <div class="mb-3">
              <label class="ad-form-label">Password</label>
              <input type="password" class="ad-form-control" placeholder="Enter Your Password">
            </div>

            <div class="mb-4">
              <div class="ad-check-wrap">
                <input class="ad-check-input" type="checkbox" id="remember">
                <label class="ad-check-label" for="remember">Remember me</label>
              </div>
            </div>

            <button type="submit" class="ad-btn-login w-100">Login to Admin Panel</button>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>

  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/owl.carousel.min.js"></script>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
